# Sestaví SSHTool a při nové verzi (VERSION v build-app.sh) automaticky vydá GitHub Release.
# Aplikace si release najde (Nastavení → O aplikaci / menu Zkontrolovat aktualizace) a ověří podpis.
name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}           # oprávnění jen na úrovni jobu (nejmenší nutná)

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write        # tag a release (vestavěný GITHUB_TOKEN, žádný osobní token)
      id-token: write        # podepsaná provenance buildu (Sigstore)
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
        with:
          fetch-depth: 0

      - name: Xcode (nejnovější stabilní – SwiftTerm 1.99 vyžaduje Swift 6.2+)
        run: |
          XC=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          [ -n "$XC" ] && sudo xcode-select -s "$XC"
          xcodebuild -version
          swift --version

      - name: Verze
        id: v
        run: |
          VERSION=$(sed -nE 's/^VERSION="\$\{VERSION_OVERRIDE:-([0-9.]+)\}"/\1/p' build-app.sh)
          [ -n "$VERSION" ] || { echo "Verze nenalezena v build-app.sh"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then echo "release=false" >> "$GITHUB_OUTPUT"; else echo "release=true" >> "$GITHUB_OUTPUT"; fi
          echo "Verze $VERSION"

      - name: FreeRDP pro přibalení (RDP bez instalace u uživatelů)
        run: |
          brew install freerdp dylibbundler
          ls /opt/homebrew/bin | grep -i freerdp || true

      - name: Build
        env:
          GITHUB_REPO: ${{ github.repository }}
          BUNDLE_FREERDP: "1"
        run: bash ./build-app.sh       # bash explicitně – nezávisí na příznaku spustitelnosti v gitu

      - name: Balíček a podpis
        if: steps.v.outputs.release == 'true'
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          V=${{ steps.v.outputs.version }}
          ditto -c -k --keepParent build/SSHTool.app "SSHTool-$V.zip"
          shasum -a 256 "SSHTool-$V.zip" | tee "SSHTool-$V.zip.sha256"
          if [ -n "$UPDATE_SIGNING_KEY" ]; then
            swift scripts/sign-update.swift "SSHTool-$V.zip"
          else
            echo "::warning::Chybí secret UPDATE_SIGNING_KEY – release bude bez podpisu a aplikace ho nenainstaluje automaticky."
          fi

      - name: Poznámky k vydání z CHANGELOG.md
        if: steps.v.outputs.release == 'true'
        run: |
          V=${{ steps.v.outputs.version }}
          awk -v v="## $V" 'index($0, v)==1 {f=1; next} /^## / && f {exit} f' CHANGELOG.md > notes.md || true
          [ -s notes.md ] || echo "SSHTool $V" > notes.md
          if [ -f build/FreeRDP-VERSIONS.txt ]; then
            {
              echo
              echo "### Přibalené závislosti RDP"
              echo '```'
              cat build/FreeRDP-VERSIONS.txt
              echo '```'
              echo "Bezpečnostní oznámení FreeRDP: https://github.com/FreeRDP/FreeRDP/security/advisories"
            } >> notes.md
          fi
          cat notes.md

      - name: SBOM (seznam přibalených závislostí)
        if: steps.v.outputs.release == 'true'
        run: |
          V=${{ steps.v.outputs.version }}
          python3 scripts/sbom.py SSHTool "$V" freerdp > "SSHTool-$V.sbom.json"
          cat "SSHTool-$V.sbom.json"

      - name: Provenance buildu (Sigstore attestace)
        if: steps.v.outputs.release == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8   # v4.2.2
        continue-on-error: true    # bez attestace se release vydá i tak
        with:
          subject-path: |
            SSHTool-${{ steps.v.outputs.version }}.zip
            SSHTool-${{ steps.v.outputs.version }}.sbom.json

      - name: GitHub Release
        if: steps.v.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ steps.v.outputs.version }}
          FILES="SSHTool-$V.zip SSHTool-$V.zip.sha256 SSHTool-$V.sbom.json"
          [ -f "SSHTool-$V.zip.sig" ] && FILES="$FILES SSHTool-$V.zip.sig"
          gh release create "v$V" $FILES --title "SSHTool $V" --notes-file notes.md --target "$GITHUB_SHA"
